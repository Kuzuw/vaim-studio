name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Self-test (engine + UI, CPU)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      VAIM_HOME: ${{ github.workspace }}/.vaim-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Python dependencies
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r app/requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes app scripts
      - name: Self-test
        run: python app/tools/selftest.py
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: .vaim-home/*.png
          if-no-files-found: ignore

  build:
    name: Windows installer
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: installer/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LLVM resource compiler (icon + version info)
        run: sudo apt-get install -y --no-install-recommends llvm
      - name: Build
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: VAIM-Studio-Setup
          path: dist/*.exe
      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/vaim_studio/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: Publish release v${{ steps.ver.outputs.version }}
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: VAIM Studio ${{ steps.ver.outputs.version }}
          body_path: CHANGELOG.md
          files: dist/*.exe
